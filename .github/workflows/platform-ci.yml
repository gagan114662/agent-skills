name: platform-ci

on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

defaults:
  run:
    working-directory: platform

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check demo/proof references resolve (no false completion claims)
        run: node scripts/check-demo-refs.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    # Runs migrations + repository tests against a real Postgres (and Redis).
    # This is the service-container integration job the #1 review flagged as missing.
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reload
          POSTGRES_PASSWORD: reload
          POSTGRES_DB: reload
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reload -d reload"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://reload:reload@localhost:5432/reload
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Migrate up
        run: pnpm --filter @reload/server db:migrate
      - name: Integration tests (real Postgres)
        run: pnpm --filter @reload/server test:integration
      - name: Prove down/up clean
        run: |
          pnpm --filter @reload/server db:rollback
          pnpm --filter @reload/server db:migrate

  perf:
    # #113 performance & capacity rails: boot the real server, hammer the hot paths with the
    # dependency-free load driver, and FAIL the PR on a budget regression (min req/s floor, max p99,
    # max error rate). Same Postgres+Redis service block as `integration` (the suite signs up a session
    # for the authenticated scenario). Regenerates docs/capacity.md as a side effect (not committed here).
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reload
          POSTGRES_PASSWORD: reload
          POSTGRES_DB: reload
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reload -d reload"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://reload:reload@localhost:5432/reload
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Migrate up
        run: pnpm --filter @reload/server db:migrate
      - name: Load test + enforce perf budgets
        run: pnpm --filter @reload/server perf
      - name: Upload measured capacity model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-model
          path: platform/docs/capacity.md
          if-no-files-found: warn

  deploy:
    # #19 acceptance: one pipeline deploys the full stack. Builds the server image and
    # boots server + Postgres + Redis (migrate-on-deploy) via compose, then smoke-tests
    # the probes, metrics, and end-to-end correlation id against the running container.
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - name: Pre-pull base images (retry transient Docker Hub timeouts)
        # The boot step below pulls these from Docker Hub; a registry blip
        # ("registry-1.docker.io: context deadline exceeded") must not fail the
        # deploy gate. Pull each with retry first so `up --build` finds them cached.
        run: |
          for img in postgres:16-alpine redis:7-alpine node:22-alpine; do
            ok=
            for attempt in 1 2 3 4 5; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull $img attempt $attempt failed; retrying in 10s..."; sleep 10
            done
            if [ -z "$ok" ]; then echo "could not pull $img after retries"; exit 1; fi
          done
      - name: Build image + boot full stack
        run: docker compose --profile full up -d --build
      - name: Wait for server readiness (/readyz)
        run: |
          for i in $(seq 1 60); do
            if curl -fs localhost:3000/readyz | grep -q '"status":"ready"'; then
              echo "server ready"; exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in time"; docker compose logs; exit 1
      - name: Smoke probes + metrics
        run: |
          curl -fs localhost:3000/livez | grep -q '"status":"ok"'
          curl -fs localhost:3000/metrics | grep -q '^http_requests_total'
      - name: Correlation id echoed end-to-end
        run: |
          curl -s -D - -o /dev/null -H 'x-request-id: ci-trace-1' localhost:3000/livez \
            | grep -iq 'x-request-id: ci-trace-1'
      - name: Teardown
        if: always()
        run: docker compose --profile full down -v

  demo-video:
    # Regenerates the PR video proofs as downloadable artifacts.
    # Best-effort: never blocks the PR (the canonical demos are committed under platform/docs/demos/).
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install recording tools (ffmpeg, asciinema, agg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg asciinema
          curl -fsSL -o /usr/local/bin/agg \
            https://github.com/asciinema/agg/releases/latest/download/agg-x86_64-unknown-linux-gnu
          chmod +x /usr/local/bin/agg
      - name: Record all demos
        run: |
          for f in scripts/demos/*.sh; do
            slug="$(basename "$f" .sh)"
            bash scripts/record-demo.sh "$slug" || echo "demo $slug failed (non-blocking)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: demo-videos
          path: platform/docs/demos/*.mp4
          if-no-files-found: warn
