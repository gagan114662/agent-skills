name: fly-deploy

# Continuous deploy of the platform API to Fly (#138, ADR-0138). The Vercel-hosted web console
# (https://ipop.ai) auto-deploys on every push to main, but the Fly API (https://api.ipop.ai, app
# `reload-api`) had NO deploy pipeline — it ran a hand-deployed image, so the marketing fleet (#123),
# pricing rails (#125) and everything since never went live. This workflow closes that gap: every push
# to main that touches the platform redeploys the API — no human runs `flyctl deploy` or `db:migrate`
# by hand (#273).
#
# Migrations + safety are gated by the Fly `[deploy] release_command` (fly.toml → release-cli.js), which
# runs on a one-off VM BEFORE traffic shifts: it applies pending DB migrations, then a host preflight,
# then a real demo-harness smoke. A non-zero exit ABORTS the rollout with the current release still
# serving (automatic rollback) and makes `flyctl deploy` below exit non-zero, turning this job red. The
# rollout itself is rolling + health-gated on `/readyz` (fly.toml). So a bad migration or a broken image
# can never reach users, and a human never has to run an infra command to ship.
#
# Auth is a single repo secret, FLY_API_TOKEN (a Fly deploy token), referenced by name and NEVER echoed.
# Setup is documented in platform/docs/operations.md → "Fly deploy (CI)".

on:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/fly-deploy.yml"]
  workflow_dispatch: {} # manual redeploy (e.g. after rotating a secret with `fly secrets set`)

# Never cancel an in-flight deploy — a half-applied rollout is worse than a queued one. Serialize.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform # fly.toml + the relative Dockerfile build context live here

permissions:
  contents: read
  issues: write # #171 post-deploy self-QA smoke opens/dedupes selfqa bug issues — nothing else

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Guard — skip cleanly when Fly deploy is not configured
        # Runs BEFORE checkout, so the default `working-directory: platform` doesn't exist yet —
        # pin this step to the runner workspace root or bash can't even start (No such file or directory).
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice title=Fly deploy not configured::set the FLY_API_TOKEN repo secret to enable API deploys — skipping."
            echo "FLY_CONFIGURED=false" >> "$GITHUB_ENV"
          else
            echo "FLY_CONFIGURED=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.FLY_CONFIGURED == 'true'
        uses: actions/checkout@v4

      - name: Set up flyctl
        if: env.FLY_CONFIGURED == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly (reload-api) — release_command migrates + smokes, then rolling rollout
        if: env.FLY_CONFIGURED == 'true'
        # `flyctl deploy` blocks until the release_command (migrate → preflight → smoke) passes AND the
        # rolling rollout's /readyz health check is green. If the release_command exits non-zero, Fly
        # aborts the rollout (the previous release keeps serving — automatic rollback) and flyctl exits
        # non-zero, failing this step. No --strategy flag needed: fly.toml pins strategy = "rolling".
        # #292: stamp the deployed commit into the image (Dockerfile ARG GIT_SHA → ENV → GET /version) so
        # the version-advance gate below can externally confirm THIS commit is the one now serving.
        run: flyctl deploy --remote-only --config fly.toml --build-arg GIT_SHA="${{ github.sha }}"

      - name: Verify readiness (/readyz green after rollout)
        if: env.FLY_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          # Fly only routes to a machine once /readyz passes, so by the time deploy returns the new
          # machine is healthy — re-assert it here as the deploy's own proof, with a short retry for the
          # routing edge to settle.
          for i in $(seq 1 10); do
            body="$(curl -fsS https://reload-api.fly.dev/readyz || true)"
            echo "readyz attempt $i: ${body:-<no response>}"
            case "$body" in
              *'"status":"ready"'*) echo "::notice title=Fly deploy verified::reload-api /readyz is ready"; exit 0 ;;
            esac
            sleep 6
          done
          echo "::error title=Fly deploy unverified::/readyz did not report ready after rollout"
          exit 1

      # #171 post-deploy self-QA: a synthetic user runs the SMOKE subset (critical/high checks) against the
      # just-deployed live product, so a regression that a human would catch by clicking around is found
      # within minutes — and filed as a deduped `selfqa` issue. Exits non-zero on a critical finding, so a
      # broken deploy turns this job red. The nightly `selfqa-nightly.yml` runs the full pass.
      - name: Set up pnpm (for the self-QA smoke)
        if: env.FLY_CONFIGURED == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node (for the self-QA smoke)
        if: env.FLY_CONFIGURED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install deps (for the self-QA smoke)
        if: env.FLY_CONFIGURED == 'true'
        run: pnpm install --frozen-lockfile

      # #292: the version-advance gate. `/readyz` (above) proves deps are reachable — but the OLD release
      # passes it too, so a deploy that silently no-ops (path-filter miss, unset-token guard, or a release
      # that never cut over) leaves prod stuck on the previous image with CI green (the v80 blocker, which
      # kept the merged #247 model fix off prod). This step probes the LIVE host's /version and asserts it
      # reports THIS commit; a mismatch (or an old/unstamped host) fails the job red. The decision is the
      # unit-tested, fail-closed `decideReleaseAdvanced` — one source of truth, no duplicated bash logic.
      - name: Verify release advanced (live /version == this commit)
        if: env.FLY_CONFIGURED == 'true'
        env:
          RELEASE_EXPECTED_SHA: ${{ github.sha }}
          RELEASE_VERIFY_URL: https://reload-api.fly.dev
        run: pnpm --filter @reload/server verify:release

      - name: Post-deploy self-QA smoke → open/dedupe selfqa bug issues
        if: env.FLY_CONFIGURED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELFQA_DRIVER: ${{ vars.SELFQA_DRIVER || 'http' }}
          SELFQA_TARGET: ${{ vars.SELFQA_TARGET || 'https://ipop.ai' }}
          RELIABILITY_PAGE_WORKSPACE_SLUG: ${{ vars.RELIABILITY_PAGE_WORKSPACE_SLUG }}
        run: pnpm --filter @reload/server selfqa:run -- --suite smoke
