name: web-deploy-freshness

# #1321: production ipop.ai can remain stale when Vercel deployment is rate-limited. This probe
# fetches the public static homepage and fails loudly when it lacks the current build stamp or still
# contains old landing copy. It is intentionally separate from uptime: a 200 OK can still be stale.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected deployed web git SHA. Defaults to this workflow commit."
        required: false
      target:
        description: "Production web URL to probe."
        required: false
        default: "https://ipop.ai/"
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "platform/apps/web/**"
      - ".github/workflows/web-deploy-freshness.yml"

concurrency:
  group: web-deploy-freshness
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  production-freshness:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_WEB_URL: ${{ inputs.target || vars.PRODUCTION_WEB_URL || 'https://ipop.ai/' }}
      REQUESTED_EXPECTED_WEB_SHA: ${{ inputs.expected_sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Resolve expected web build SHA
        id: expected
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_EXPECTED_WEB_SHA:-}" ]; then
            echo "sha=${REQUESTED_EXPECTED_WEB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(
            git log -1 --format=%H HEAD -- \
              apps/web \
              packages/shared \
              vercel.json \
              scripts/vercel-ignore-build.mjs \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml \
              tsconfig.json
          )"
          if [ -z "$sha" ]; then
            echo "Could not resolve a web-relevant SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Probe live web deploy freshness
        env:
          EXPECTED_WEB_SHA: ${{ steps.expected.outputs.sha }}
        run: |
          for attempt in {1..12}; do
            echo "freshness attempt ${attempt}/12 for ${PRODUCTION_WEB_URL} expecting ${EXPECTED_WEB_SHA}"
            if pnpm --filter @reload/web deploy:freshness; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 30
            fi
          done
          exit 1
