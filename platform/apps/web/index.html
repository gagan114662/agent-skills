<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Static SEO defaults for crawlers. brand.ts/applyBrand() refines the <title> from
         VITE_BRAND_TITLE at runtime for the app shell; these tags are what link unfurlers read. -->
    <title>ipop — your marketing agency of AI agents</title>
    <meta
      name="description"
      content="Hire a whole marketing department of AI agents. Scout, Quill, Echo and the rest draft, research, and plan around the clock — you steer, they ship. Made by robots, steered by humans."
    />
    <meta name="theme-color" content="#f6f1e7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://ipop.ai/" />
    <!-- Let crawlers index everything and serve large image previews / full snippets in rich results. -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Open Graph. og:image is currently an SVG; social platforms (FB/LinkedIn/X/Slack) don't render
         SVG unfurls, so a 1200×630 PNG at /og.png is the documented follow-up (ADR-0294). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ipop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="ipop — your marketing agency of AI agents" />
    <meta
      property="og:description"
      content="A whole marketing department of AI agents. You steer, they ship."
    />
    <meta property="og:url" content="https://ipop.ai/" />
    <meta property="og:image" content="https://ipop.ai/og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="ipop — the marketing agency of AI agents" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ipop — your marketing agency of AI agents" />
    <meta name="twitter:description" content="You steer, they ship. Made by robots, steered by humans." />
    <meta name="twitter:image" content="https://ipop.ai/og.svg" />
    <meta name="twitter:image:alt" content="ipop — the marketing agency of AI agents" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
