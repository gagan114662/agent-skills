# Fly.io deployment for the Reload API (@reload/server) — #108.
# Always-on Fastify server (WebSocket gateway + Postgres + Redis) that the Vercel-hosted web
# console (https://ipop.ai) talks to at https://api.ipop.ai. Built from the existing multi-stage
# Dockerfile; migrations run on deploy via apps/server/docker-entrypoint.sh.
#
# Secrets (DATABASE_URL, REDIS_URL) are set with `fly secrets set` and are NOT stored here.
app = "reload-api"
primary_region = "yyz"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  RELOAD_PROFILE = "prod"
  # Real agents in production (#68/#246): the `claude-code` harness runs an actual Claude session per
  # @mention, in-host (AGENT_RUNTIME=local; the `claude` CLI is baked into the image). Auth is
  # SUBSCRIPTION-ONLY and per-tenant — each workspace connects its OWN Claude (Settings → Connect
  # Claude → CLAUDE_CODE_OAUTH_TOKEN in the per-tenant vault), so no model credential is baked here.
  # #246: there is NO ANTHROPIC_API_KEY fallback for agent runs — a workspace that hasn't connected (or
  # whose token expired) gets a friendly in-channel "reconnect your Claude" reply, never an API-key
  # charge and never a crash. Tracing: `fly secrets set -a reload-api BRAINTRUST_API_KEY=…`.
  AGENT_HARNESS = "claude-code"
  AGENT_RUNTIME = "local"
  # #394 reliability: the watchdog idle/wall-clock reaper defaults (AGENT_IDLE_MS=120s, AGENT_WALLCLOCK_MS=600s
  # in env.ts) are too aggressive for a real Opus session — the model often THINKS quietly for >2 min between
  # stdout, so the idle timer reaped healthy sessions and surfaced them as "session failed (exit n/a)" (~40% of
  # runs, #394). Raise idle to 5 min and wall-clock to 30 min so a deliberating agent (and a multi-step
  # collaboration handoff) runs to completion instead of being killed mid-think.
  AGENT_IDLE_MS = "300000"
  AGENT_WALLCLOCK_MS = "1800000"
  # Deployment-wide default model. The harness emits an env-gated --model flag (#52) that reads this;
  # a workspace's owner-picked model (Settings → Connect Claude) and a per-session #52 selection still
  # override it. MUST be a model the API actually serves — #242/#246: a non-existent id (`claude-fable-5`)
  # made every claude-code session exit 1 ("error · exit 1") producing nothing, because the harness passed
  # `--model claude-fable-5` and the API rejected it. The fleet model is now the OWNER DECISION
  # `claude-opus-4-8` (run on the connected SUBSCRIPTION token, never an API key). A mis-set value is
  # caught BEFORE spawn by the #246 launch preflight (runtime/models.ts → ModelUnavailableError) and
  # surfaced as an actionable owner message + self-heal incident, never an opaque mid-run crash.
  ANTHROPIC_MODEL = "claude-opus-4-8"
  # #108 CORS allowlist: lets the Vercel console make credentialed calls cross-origin.
  RELOAD_WEB_ORIGIN = "https://ipop.ai,https://www.ipop.ai"
  # #138 marketing department fleet: turn the agency ON for the live product (the config env base layer,
  # #58). Every workspace is seeded on signup AND backfilled idempotently on boot, so the owner lands in
  # a working agency (SEO/Social/Content/Email/Paid/Analytics/Brand) instead of an empty channel list.
  # seedWelcomeTasks stays false: the seed/backfill creates channels + named agents but launches NO
  # welcome sessions, so it never spends — @mentions still go through the venture + #13 approval gates.
  RELOAD_MARKETING_ENABLED = "true"
  RELOAD_MARKETING_SEED_WELCOME_TASKS = "false"
  # #147 trial free tier (ADR-0147): every workspace without a paid plan gets a usable, metered free
  # tier so a fresh/owner workspace can run agents BEFORE checkout→caps is wired. Default-ON in code;
  # set here explicitly so the live free-tier policy is visible + tunable without a redeploy of code.
  # A paid plan's per-tenant managed [scale] override replaces these. Set RELOAD_TRIAL_ENABLED=false to
  # restore the pre-#147 unlimited-by-default behavior.
  RELOAD_TRIAL_ENABLED = "true"
  RELOAD_TRIAL_TENANT_CONCURRENCY = "1"
  RELOAD_TRIAL_BUDGET_CENTS = "500"
  # #98 billing opt-in: present the [billing] config section so the per-tenant checkout gate is open
  # (otherwise /pricing → "Checkout isn't switched on for this workspace yet" → 409). The PROVIDER is
  # selected by BILLING_PROVIDER (a fly secret) + the per-tenant STRIPE_* secrets on the #25 resolver;
  # this flag only flips the config opt-in. Durable replacement for the per-tenant /etc/reload/managed.toml.
  RELOAD_BILLING_ENABLED = "true"
  # Auto model-selection via convene-llm-gateway (Claude-orchestrated). DEFAULT OFF: a session that
  # pins no explicit model keeps using ANTHROPIC_MODEL above. To roll out to the OWNER workspace only:
  #   1) point at the gateway:  fly secrets set -a reload-api \
  #        LLM_GATEWAY_URL=https://<gateway-host> LLM_GATEWAY_KEY=<gateway shared-secret>
  #   2) flip the master switch here:  RELOAD_AUTO_MODEL = "true"
  #   3) enable JUST the owner in the managed layer:  [workspace.<owner-id>.autoModel] enabled = true
  # The chosen model is still validated against the tenant's #52 models allow-list, and the per-tenant
  # #71 budget cap is routed to the gateway as the per-call cost ceiling. A gateway outage degrades to
  # ANTHROPIC_MODEL — a session is never blocked. The gateway KEY is a SECRET (never set in [env]).
  # RELOAD_AUTO_MODEL = "true"

# Release gate + rolling rollout (#166/#238; migrations gated in #273). On every deploy, Fly boots the
# NEW image on a one-off machine BEFORE traffic shifts and runs the release_command. A non-zero exit
# ABORTS the rollout with the current (healthy) release still serving — so the gate IS the automatic
# rollback, and shipping never needs a human at a terminal. release-cli.js runs three gates, fail-fast:
#   0. MIGRATIONS (#273) — apply pending DB migrations (`migrate up`) HERE, before the cutover. A bad
#      migration aborts the deploy with the old code + schema live, instead of crash-looping freshly
#      rolled machines (the migrate-on-boot failure mode). Migrations are additive, so the still-running
#      old code is unaffected. (docker-entrypoint.sh still migrates on boot as an idempotent no-op safety
#      net for local/compose; on Fly this gate is the authority and the boot run finds nothing pending.)
#   1. PREFLIGHT (#238) — assert host posture: `bash`/`git` on PATH, the `claude` binary, AND that the
#      per-session workspace root (RELOAD_WORKSPACE_ROOT, baked + chowned in the Dockerfile) is WRITABLE
#      by the non-root runtime user (the #238 cause: every session died at provision with exit n/a).
#   2. SMOKE (#166) — PROVISION a per-session workspace + spawn ONE real demo-harness session end-to-end.
# The migration gate touches the DB (DATABASE_URL is injected into the release VM); preflight + smoke
# need no model spend. strategy = "rolling": machines are replaced one at a time and Fly waits for the
# /readyz http check below to pass before continuing — a health-gated rollout.
[deploy]
  strategy = "rolling"
  release_command = "node /app/apps/server/dist/runtime/release-cli.js"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: one machine, never auto-stopped (min instances 1 per the deploy brief).
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  # Readiness gate: Fly only routes to a machine once deps (Postgres + Redis) are reachable.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  # Bumped from 512mb (#68): a real in-host `claude-code` session needs headroom beyond the API
  # server itself. Concurrency is still capped by the #71 admission chokepoint; scale up if a tenant's
  # budget allows more parallel sessions.
  memory = "1024mb"
